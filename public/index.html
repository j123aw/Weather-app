<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="weather.css">
</head>
<body>
  <div class="container">
    <h1 class="title">🌤️ Weather App</h1>
    <div class="form">
      <input type="text" id="cityInput" placeholder="Enter City">
      <button onclick="getWeather()">Get Weather</button>
    </div>
    <div id="weatherResult" class="result-box"></div>
    
    <div class="dictionary-section">
      <h2 class="dictionary-title">📖 Weather Dictionary</h2>
      <div class="search-box">
        <input type="text" id="termSearch" placeholder="Search weather term...">
        <button onclick="searchTerm()">Search</button>
      </div>
      <div id="dictionaryResult" class="dictionary-result"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
